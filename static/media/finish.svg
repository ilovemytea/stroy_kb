<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 455" role="img"><title>Плитка в мокрой зоне: порядок слоёв</title><rect width="900" height="455" rx="18" fill="#f2f0e9"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#263a35">Плитка в мокрой зоне: порядок слоёв</text><g font-family="Arial,sans-serif"><path d="M55 95 l205 -28 135 52 -205 28z" fill="#d26949" stroke="#3c3d38" stroke-width="2"/><path d="M55 95v27l135 52v-27z" fill="#5b5143" opacity=".25"/><path d="M395 117h28" stroke="#47544f" stroke-width="2"/><text x="436" y="122" font-size="18" fill="#263a35">Плитка и заполненные швы</text><path d="M55 153 l205 -28 135 52 -205 28z" fill="#e8be85" stroke="#3c3d38" stroke-width="2"/><path d="M55 153v27l135 52v-27z" fill="#5b5143" opacity=".25"/><path d="M395 175h28" stroke="#47544f" stroke-width="2"/><text x="436" y="180" font-size="18" fill="#263a35">Совместимый плиточный клей</text><path d="M55 211 l205 -28 135 52 -205 28z" fill="#b8c8bc" stroke="#3c3d38" stroke-width="2"/><path d="M55 211v27l135 52v-27z" fill="#5b5143" opacity=".25"/><path d="M395 233h28" stroke="#47544f" stroke-width="2"/><text x="436" y="238" font-size="18" fill="#263a35">Гидроизоляция, ленты и манжеты</text><path d="M55 269 l205 -28 135 52 -205 28z" fill="#ead9c3" stroke="#3c3d38" stroke-width="2"/><path d="M55 269v27l135 52v-27z" fill="#5b5143" opacity=".25"/><path d="M395 291h28" stroke="#47544f" stroke-width="2"/><text x="436" y="296" font-size="18" fill="#263a35">Подготовка по инструкции</text><path d="M55 327 l205 -28 135 52 -205 28z" fill="#93adb8" stroke="#3c3d38" stroke-width="2"/><path d="M55 327v27l135 52v-27z" fill="#5b5143" opacity=".25"/><path d="M395 349h28" stroke="#47544f" stroke-width="2"/><text x="436" y="354" font-size="18" fill="#263a35">Прочное ровное основание</text></g><text x="40" y="430" font-family="Arial,sans-serif" font-size="15" fill="#5b645d">Плитка и затирка не заменяют гидроизоляцию</text></svg>
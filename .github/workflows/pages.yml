name: Publish dusovstroimir

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'data/**'
      - 'search/**'
      - 'expert.py'
      - 'docs/evaluate.py'
      - 'tests/memory_kb.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build public knowledge base
        run: python3 web/build_public.py
      - name: Compare browser algorithms with Python
        run: node web/tests/parity.mjs
      - name: Validate crawlable HTML and sitemap
        run: python3 web/tests/test_seo.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
